name: CI with Tests and SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore

    - name: Begin SonarCloud analysis
      env:
        SECRET: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner begin /k:"yuvraj1165_BookLendingService" /o:"yuvraj1165" /d:sonar.login="$SECRET" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="coverage-report/coverage.cobertura.xml"

    - name: Build solution
      run: dotnet build --no-restore
       
    - name: Create coverage-report directory
      run: mkdir -p coverage-report

    - name: Run tests with Coverlet (produce cobertura XML)
      # Run tests for the whole solution so all test projects are covered.
      run: |
        dotnet test BookLendingService.slnx --no-build --verbosity normal \
          /p:CollectCoverage=true \
          /p:CoverletOutput=coverage-report/coverage.cobertura.xml \
          /p:CoverletOutputFormat=cobertura
    
    - name: Debug:List coverage files
      run: |
        echo "Listing coverage-report directory:"
        ls -R coverage-report || true

    - name: Debug:Print coverage XML (if present)
      run: |
        COVERAGE_XML="coverage-report/coverage.cobertura.xml"
        if [ -f "$COVERAGE_XML" ]; then
          echo "Coverage XML found:"
          cat "$COVERAGE_XML"
        else
          echo "Coverage XML not found at $COVERAGE_XML"
          # Show any file that was produced for easier debugging
          echo "Other files in coverage-report:"
          ls -la coverage-report || true
          exit 1
        fi

    - name: End SonarCloud analysis
      env:
        SECRET: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.login="$SECRET"
