name: CI with Tests and SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore

    - name: Begin SonarCloud analysis
      env:
        SECRET: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner begin /k:"yuvraj1165_BookLendingService" /o:"yuvraj1165" /d:sonar.login="$SECRET" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="coverage-report/merged/coverage.cobertura.xml"

    - name: Build solution
      run: dotnet build --no-restore
       
    - name: Create coverage-report directory
      run: mkdir -p coverage-report

    - name: Run BookLendingService.Data.Tests with Coverlet
      run: dotnet test BookLendingService.Data.Tests/BookLendingService.Data.Tests.csproj --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=coverage-report/bookLendingService.Data.Tests.cobertura.xml

    - name: Debug:Check BookLendingService.Data.Tests coverage file
      run: ls -la coverage-report/bookLendingService.Data.Tests.cobertura.xml

    - name: Run BookLendingService.Application.Tests with Coverlet
      run: dotnet test BookLendingService.Application.Tests/BookLendingService.Application.Tests.csproj --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=coverage-report/BookLendingService.Application.Tests.cobertura.xml

    - name: Debug:Check BookLendingService.Application.Tests coverage file
      run: ls -la coverage-report/BookLendingService.Application.Tests.cobertura.xml

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
    
    - name: Merge coverage reports
      run: |
        echo "Merging coverage reports..."
        reportgenerator -reports:"coverage-report/*.cobertura.xml" -targetdir:"coverage-report/merged" -reporttypes:Cobertura || {
          echo "No coverage reports found to merge."
          exit 1
        }
    
    - name: Debug:List coverage XML files
      run: |
        echo "Checking for coverage files:"
        find coverage-report -name "*.cobertura.xml" -exec ls -la {} \;

    - name: Debug:Check merged coverage file
      run: ls -l coverage-report/merged

    - name: Debug:Print coverage XML (if present)
      run: |
        COVERAGE_XML="coverage-report/merged/coverage.cobertura.xml"
        if [ -f "$COVERAGE_XML" ]; then
          echo "Merged Coverage XML found:"
          cat "$COVERAGE_XML"
        else
          echo "Merged Coverage XML not found at $COVERAGE_XML"
          # Show any file that was produced for easier debugging
          echo "Other files in coverage-report/merged:"
          ls -la coverage-report/merged  || true
          exit 1
        fi
  
    - name: End SonarCloud analysis
      env:
        SECRET: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.login="$SECRET"
