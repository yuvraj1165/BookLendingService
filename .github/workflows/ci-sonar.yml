name: CI with Tests and SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore

    - name: Begin SonarCloud analysis
      env:
        SECRET: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner begin /k:"yuvraj1165_BookLendingService" /o:"yuvraj1165" /d:sonar.login="$SECRET" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="coverage-report/coverage.cobertura.xml"

    - name: Build solution
      run: dotnet build --no-restore

    - name: Run tests with Coverlet
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Convert .coverage to cobertura.xml
      run: |
        for file in $(find . -type f -name '*.coverage'); do
          coverlet "$file" --target "dotnet" --targetargs "test --no-build" --format cobertura --output "./coverage-report/coverage.cobertura.xml"
        done

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Convert coverage to Cobertura
      run: |
        reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"Cobertura"

    - name: End SonarCloud analysis
      env:
        SECRET: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.login="$SECRET"
